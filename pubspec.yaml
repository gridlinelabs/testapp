name: billsplit_ai
description: BillSplit AI — Smart expense splitting with AI receipt scanning
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # AI & OCR
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  http: ^1.2.0

  # Navigation
  go_router: ^13.2.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  intl: ^0.19.0
  flutter_animate: ^4.3.0

  # Storage & Utils
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  collection: ^1.18.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
