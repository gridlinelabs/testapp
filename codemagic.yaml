workflows:
  android-release:
    name: BillSplit AI — Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.billsplitai.app"
        CLAUDE_API_KEY: $CLAUDE_API_KEY  # Set in Codemagic Environment Variables

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'claude/billsplit-ai-app-2gLIQ'
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK (debug-signed)
        script: |
          flutter build apk --debug \
            --dart-define=CLAUDE_API_KEY=$CLAUDE_API_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - flutter_drive.log


